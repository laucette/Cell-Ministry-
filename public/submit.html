<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submit your CM & SA report</title>
<style>
:root{--ink:#1c1b3a;--ink2:#4a4970;--bg:#eef1f7;--line:#dde1ee;--acc:#4f46e5;--g:#2fa36b;--y:#f2c230;--r:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:20px 18px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:#b9b8e0;font-size:13px}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 2px;font-size:18px}.sub{color:var(--ink2);font-size:14px;margin:0 0 12px}
h3{margin:22px 0 0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.f i{color:var(--r);font-style:normal}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink)}
input:disabled,textarea:disabled{background:#f3f4f8}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.seg button.on.yes{background:var(--g);border-color:var(--g);color:#fff}
.seg button.on.no{background:var(--r);border-color:var(--r);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label.f{margin-top:14px}
.btn{width:100%;margin-top:18px;font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px;background:var(--acc);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.msg.ok{background:#dff5e9;color:#14613f}.msg.err{background:#fde3e4;color:#8a1f24}.msg.wait{background:#fff3cc;color:#6b5200}
.pv{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:block}
small.h{color:var(--ink2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a5a0f5;outline-offset:1px}
</style>
</head>
<body>
<header><h1>CM &amp; SA Report</h1><p>Weekly submission for cell leaders</p></header>
<main id="app"><div class="card">Loading…</div></main>
<script>
const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let code=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
try{if(!code)code=localStorage.getItem('cmsa-code')||''}catch(e){}
const blank=()=>({held:'',date:'',time:'',venue:'',att:'',ft:'',ba:'',tg:'',offer:'',sa:'',note:'',photo:''});
let ro=false,me=null,form=blank(),msg=null,busy=false;
const STAT={pending:['wait','Submitted. Waiting for approval.'],approved:['ok','Approved. Thank you!'],rejected:['err','Your report needs a correction. Please update it and submit again.']};
const today=new Date().toLocaleDateString('en-CA');

async function load(){
  if(!code)return render();
  try{
    const r=await fetch('/api/me?code='+encodeURIComponent(code));const j=await r.json();
    if(!r.ok){msg=['err',j.error];me=null;code='';return render()}
    me=j;try{localStorage.setItem('cmsa-code',code)}catch(e){}
    if(j.sub){const s=j.sub;form=blank();Object.assign(form,{held:s.cm==='g'?'yes':'no',date:s.date,time:s.time,venue:s.venue,att:s.att,ft:s.ft,ba:s.ba,tg:s.tg,offer:s.offer,sa:s.sa,note:s.note});
      for(const k in form)if(form[k]==null)form[k]=''}
  }catch(e){msg=['err','Could not reach the server. Check your internet and try again.']}
  render();
}
const inp=(k,label,type,extra='')=>`<label class="f" for="f-${k}">${label} <i>*</i></label><input id="f-${k}" type="${type}" ${extra} ${ro?'disabled':''} value="${esc(form[k])}">`;
const num=(k,label)=>inp(k,label,'number','min="0" step="1" inputmode="numeric"');
const seg=k=>`<div class="seg" data-k="${k}"><button class="yes ${form[k]==='yes'?'on':''}" data-v="yes" ${ro?'disabled':''}>Yes</button><button class="no ${form[k]==='no'?'on':''}" data-v="no" ${ro?'disabled':''}>No</button></div>`;

function render(){
  const a=$('#app');
  if(!me){a.innerHTML=`<div class="card"><h2>Enter your access code</h2><p class="sub">Use the link you were sent, or type the code here.</p>
    ${msg?`<div class="msg ${msg[0]}">${esc(msg[1])}</div>`:''}
    <input id="cd" placeholder="e.g. K7M2QX" autocapitalize="characters" autocomplete="off" value="${esc(code)}"><button class="btn" id="go">Continue</button></div>`;return}
  const o=me.open,st=me.sub&&STAT[me.sub.status];
  const locked=(me.sub&&me.sub.status==='approved')||!!(o&&o.closed);ro=locked;
  let h=`<div class="card"><h2>${esc(me.leader)}</h2><p class="sub">${esc(me.cell)} · ${esc(me.pcf)}</p>`;
  if(!o)return a.innerHTML=h+`<div class="msg wait">Submissions are not open yet. Please check back soon.</div></div>`;
  h+=`<p class="sub"><b>${M[o.m]} Week ${o.w}</b></p>`;
  if(o.closed)h+=`<div class="msg wait">Submissions for this week are closed.</div>`;
  if(msg)h+=`<div class="msg ${msg[0]}">${esc(msg[1])}</div>`;
  else if(st)h+=`<div class="msg ${st[0]}">${st[1]}</div>`;
  h+=`<label class="f">Did your cell meeting hold this week? <i>*</i></label>${seg('held')}`;
  if(form.held==='yes'){
    h+=`<h3>Meeting details</h3>
    ${inp('date','Date of meeting','date',`max="${today}"`)}
    ${inp('time','Time','time')}
    ${inp('venue','Venue','text','maxlength="120" autocomplete="off"')}
    <div class="two"><div>${num('att','Attendance')}</div><div>${num('ft','No. of first timers')}</div></div>
    <div class="two"><div>${num('ba','No. got born again')}</div><div>${num('tg','No. spoke in tongues')}</div></div>
    ${inp('offer','Offering taken (₦)','number','min="0" step="0.01" inputmode="decimal"')}
    <label class="f" for="f-photo">Picture proof of the meeting (optional)</label>
    <input id="f-photo" type="file" accept="image/*" ${ro?'disabled':''}>
    ${form.photo?`<img class="pv" src="${form.photo}" alt="Photo preview">`:(me.sub&&me.sub.photo?'<small class="h">A photo is already attached. Choose another to replace it.</small>':'')}`;
  }else if(form.held==='no'){
    h+=`<label class="f" for="f-note">Why did the meeting not hold? <i>*</i></label><textarea id="f-note" rows="3" maxlength="300" ${ro?'disabled':''}>${esc(form.note)}</textarea>`;
  }
  if(form.held){
    h+=`<h3>Sunday service</h3>${num('sa','Sunday service attendance')}`;
    if(form.held==='yes')h+=`<label class="f" for="f-note">Note (optional)</label><textarea id="f-note" rows="2" maxlength="300" ${ro?'disabled':''}>${esc(form.note)}</textarea>`;
    h+=`<button class="btn" id="sb" ${locked||busy?'disabled':''}>${me.sub?'Update report':'Submit report'}</button>`;
  }
  a.innerHTML=h+'</div>';
}

function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};
  img.onerror=()=>rej(new Error('bad image'));img.src=u})}

document.addEventListener('click',async e=>{
  if(e.target.id==='go'){code=$('#cd').value.trim().toUpperCase();msg=null;return load()}
  const b=e.target.closest('.seg button');
  if(b){form[b.parentNode.dataset.k]=b.dataset.v;msg=null;return render()}
  if(e.target.id==='sb'){
    const need=form.held==='yes'?['date','time','venue','att','ft','ba','tg','offer','sa']:['sa','note'];
    if(need.some(k=>String(form[k]).trim()===''))return(msg=['err','Please fill in every required box (use 0 where there is none).'],render(),window.scrollTo(0,0));
    busy=true;e.target.disabled=true;
    const p={code,held:form.held==='yes',sa:form.sa,note:form.note};
    if(p.held)Object.assign(p,{date:form.date,time:form.time,venue:form.venue,att:form.att,ft:form.ft,ba:form.ba,tg:form.tg,offer:form.offer,photo:form.photo||undefined});
    try{
      const r=await fetch('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)});
      const j=await r.json();
      if(!r.ok)msg=['err',j.error];else{me.sub=j.sub;form.photo='';msg=['ok','Submitted. Waiting for approval.']}
    }catch(x){msg=['err','Could not submit. Check your internet and try again.']}
    busy=false;render();window.scrollTo(0,0);
  }
});
document.addEventListener('input',e=>{
  const k=(e.target.id||'').startsWith('f-')?e.target.id.slice(2):'';
  if(k&&k!=='photo')form[k]=e.target.value;
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f-photo'&&e.target.files[0]){
    try{form.photo=await shrink(e.target.files[0]);msg=null}catch(x){msg=['err','That picture could not be read. Try another one.']}
    render()}
});
load();
</script>
</body>
</html>
